{% extends "layout.html" %}

{% block title %}Drivers{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Drivers</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>License Number</th>
                <th>Category</th>
                <th>Phone</th>
                <th>Safety Score</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="driversTable">
        </tbody>

    </table>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/drivers.js') }}"></script>
{% endblock %}
