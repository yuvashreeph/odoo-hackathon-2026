{% extends "layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white vh-100">

            <h3 class="mt-3">TransitOps</h3>

            <ul class="nav flex-column mt-4">

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Vehicles</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Drivers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Trips</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">Maintenance</a>
                </li>

            </ul>

        </div>

        <!-- Main -->

        <div class="col-md-10">

            <nav class="navbar navbar-light bg-light shadow">

                <div class="container-fluid">

                    <span class="navbar-brand">
                        Dashboard
                    </span>

                    <button
                        class="btn btn-danger"
                        onclick="logout()">

                        Logout

                    </button>

                </div>

            </nav>

            <div class="container mt-4">

                <div class="row">

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h6>Total Vehicles</h6>

                                <h2 id="totalVehicles">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h6>Available</h6>

                                <h2 id="availableVehicles">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h6>On Trip</h6>

                                <h2 id="onTrip">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card text-center shadow">

                            <div class="card-body">

                                <h6>Maintenance</h6>

                                <h2 id="maintenance">0</h2>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="row mt-5">

                    <div class="col-md-6">

                        <canvas id="vehicleChart"></canvas>

                    </div>

                    <div class="col-md-6">

                        <canvas id="tripChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
